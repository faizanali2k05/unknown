# =============================================================================
#  Unknown — Phase 1 infrastructure
# -----------------------------------------------------------------------------
#  This VPS is SHARED with unrelated production workloads (seema/*, n8n).
#  Safety contract:
#    • Every resource is prefixed `unknown-`. Compose project name: `unknown`.
#    • One dedicated bridge network `unknown-net`. We never attach to
#      seema_default, n8n_default or the default bridge.
#    • Postgres and Redis publish NOTHING — they are reachable only by
#      container name over unknown-net. A port clash with the other stacks is
#      therefore structurally impossible.
#    • The API publishes on the docker bridge gateway (172.17.0.1) only, never
#      0.0.0.0. That is the same pattern the existing n8n vhost uses, and it is
#      what lets the containerised Caddy reach us (inside that container
#      127.0.0.1 means Caddy itself, not the host).
#
#  Usage — always from this directory:
#      docker compose up -d
#      docker compose logs -f unknown-api
#
#  LiveKit uses host networking for WebRTC media; do not add standalone
#  Coturn without checking host ports and certificate requirements.
# =============================================================================

name: unknown

services:
  # ---------------------------------------------------------------------------
  #  PostgreSQL — system of record. Not published.
  # ---------------------------------------------------------------------------
  unknown-postgres:
    image: postgres:16-alpine
    container_name: unknown-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - unknown-pgdata:/var/lib/postgresql/data
    networks: [unknown-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  Redis — presence, socket routing, ephemeral state. Not published.
  # ---------------------------------------------------------------------------
  unknown-redis:
    image: redis:7-alpine
    container_name: unknown-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - unknown-redisdata:/data
    networks: [unknown-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  MinIO — self-hosted S3-compatible storage for avatars and message media.
  #  The S3 API is published on the docker bridge gateway so Caddy can serve
  #  presigned URLs at media.<domain>; the admin console is never published.
  # ---------------------------------------------------------------------------
  unknown-minio:
    image: minio/minio:latest
    container_name: unknown-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - unknown-miniodata:/data
    networks: [unknown-net]
    ports:
      - "${MINIO_BIND_ADDR:-172.17.0.1}:${MINIO_HOST_PORT:-9100}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  #  NestJS API + Socket.IO gateway.
  #  Published ONLY on the docker bridge gateway so Caddy can reach it.
  # ---------------------------------------------------------------------------
  unknown-api:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    image: unknown-api:latest
    container_name: unknown-api
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      unknown-postgres: { condition: service_healthy }
      unknown-redis: { condition: service_healthy }
      unknown-minio: { condition: service_healthy }
    networks: [unknown-net]
    ports:
      - "${API_BIND_ADDR:-172.17.0.1}:${API_HOST_PORT:-8100}:${API_PORT:-3000}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:'+(process.env.API_PORT||3000)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  #  LiveKit SFU — every call is relayed through it.
  #
  #  Host networking, because WebRTC needs to advertise the real public IP and
  #  hand out a UDP media range; going through a bridge would break ICE.
  #  Signaling (7880) stays internal and is proxied by the app's Nginx vhost.
  #  The media and TURN ports are documented in livekit.yaml.
  #
  #  LiveKit's embedded TURN server avoids a separate Coturn container.
  # ---------------------------------------------------------------------------
  unknown-livekit:
    image: livekit/livekit-server:latest
    container_name: unknown-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    volumes:
      - ./livekit.runtime.yaml:/etc/livekit.yaml:ro
      # Certbot's `live/` paths are symlinks into `archive/`; mount only this
      # app domain's certificate directories, not the host's full cert store.
      - /etc/letsencrypt/live/unknown.5kassi.com:/etc/letsencrypt/live/unknown.5kassi.com:ro
      - /etc/letsencrypt/archive/unknown.5kassi.com:/etc/letsencrypt/archive/unknown.5kassi.com:ro

networks:
  unknown-net:
    name: unknown-net
    driver: bridge

volumes:
  unknown-pgdata:
    name: unknown-pgdata
  unknown-redisdata:
    name: unknown-redisdata
  unknown-miniodata:
    name: unknown-miniodata
