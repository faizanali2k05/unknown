# Coturn configuration template. Render/set the authentication secret from
# TURN_STATIC_AUTH_SECRET at deployment time; never put a real secret here.
listening-port=3478
external-ip=__SET_TURN_EXTERNAL_IP__
realm=turn.seemaai.co.uk
server-name=turn.seemaai.co.uk
use-auth-secret
static-auth-secret=__SET_TURN_STATIC_AUTH_SECRET__
min-port=50200
max-port=50300
no-cli
no-tlsv1
no-tlsv1_1
fingerprint
stale-nonce=600
log-file=stdout
