# =============================================================================
#  LiveKit SFU config. Rendered from infra/.env by scripts/deploy-livekit.sh —
#  edit that script, not this file, or the next deploy will overwrite you.
#
#  Required public firewall ports for media and TURN:
#    3478/udp  embedded TURN/UDP
#    5349/tcp  embedded TURN/TLS
#    40000-40100/udp  embedded TURN relay allocations
#    7881/tcp  ICE/TCP fallback
#    50000-50100/udp  media
#  Signaling on 7880/tcp stays behind the Unknown Nginx vhost.
# =============================================================================

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Discover the public IP so ICE candidates are reachable from mobile networks.
  use_external_ip: true

keys:
  # Filled in at deploy time from LIVEKIT_API_KEY / LIVEKIT_API_SECRET.
  __API_KEY__: __API_SECRET__

room:
  auto_create: true
  # Rooms are created per call and abandoned once both sides hang up.
  empty_timeout: 120
  departure_timeout: 20
  max_participants: 8

turn:
  enabled: true
  relay_range_start: 40000
  relay_range_end: 40100
  domain: unknown.5kassi.com
  tls_port: 5349
  cert_file: /etc/letsencrypt/live/unknown.5kassi.com/fullchain.pem
  key_file: /etc/letsencrypt/live/unknown.5kassi.com/privkey.pem
  udp_port: 3478

logging:
  level: info
