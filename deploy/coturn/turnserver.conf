# =============================================================================
#  UNKNOWN — coturn TURN/STUN config (Phase 4)
# -----------------------------------------------------------------------------
#  Host-networked. The relay UDP range (min/max-port) must match .env
#  (TURN_MIN_PORT / TURN_MAX_PORT) and be opened in the firewall (Confirm-before).
#  Replace __EXTERNAL_IP__ and the shared secret at deploy time.
# =============================================================================

listening-port=3478
# tls-listening-port=5349        # enable if you terminate TLS directly on coturn

# Public IP of the VPS (set to 69.62.110.2 or the real external IP).
external-ip=__EXTERNAL_IP__

# Realm = your TURN domain.
realm=turn.seemaai.co.uk
server-name=turn.seemaai.co.uk

# Authentication: long-term credentials via a static shared secret.
# Must equal TURN_STATIC_AUTH_SECRET in .env; LiveKit/clients derive creds from it.
use-auth-secret
static-auth-secret=__CHANGE_ME_64_HEX__

# Relay UDP port range (must be opened in firewall, distinct from LiveKit's).
min-port=50200
max-port=50300

# Hardening.
no-cli
no-tlsv1
no-tlsv1_1
fingerprint
stale-nonce=600

# Logging.
verbose
log-file=stdout
