# =============================================================================
#  UNKNOWN — Media plane (Phase 4): LiveKit SFU + coturn
# -----------------------------------------------------------------------------
#  Brought up ONLY after the MVP demo, on explicit go-ahead.
#
#  Both use host networking (recommended for WebRTC/UDP media). That means they
#  bind directly on the host — so the UDP ranges in .env MUST be confirmed free
#  AND the firewall opening is a "Confirm-before" action (ask first).
#
#  Usage (additive — does not disturb the data stack):
#     docker compose -p unknown -f docker-compose.yml -f docker-compose.media.yml up -d unknown_livekit unknown_coturn
# =============================================================================

name: unknown

services:
  unknown_livekit:
    image: livekit/livekit-server:latest
    container_name: unknown_livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

  unknown_coturn:
    image: coturn/coturn:latest
    container_name: unknown_coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/turnserver.conf:ro
    command: ["-c", "/etc/turnserver.conf"]
